version: '3.8'

services:
  web:
    build: .
    ports:
      - "8081:80"
    depends_on:
      - db
    environment:
      - CI_ENV=production
      - DB_HOST=db
      - DB_USER=pi
      - DB_PASS=cambiar0102
      - DB_NAME=stock

  db:
    image: mariadb:10.6
    command: --skip-name-resolve
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock
      MYSQL_USER: pi
      MYSQL_PASSWORD: cambiar0102
    ports:
      - "3306:3306"
    volumes:
      - ./DATABASE_FILE:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

volumes:
  db_data:
